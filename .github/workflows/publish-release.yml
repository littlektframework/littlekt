name: publish-release

on:
  release:
    types: [ published ]

env:
  SIGNING_SECRET_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
  SIGNING_PASSWORD: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
  OSSRH_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
  OSSRH_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Read version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$TAG' must look like v1.2.3"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Setup Java JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: adopt
      - name: Grant gradlew execution permissions
        run: chmod +x gradlew
      - name: Publish release to Sonatype staging
        run: >
          ./gradlew -PlittleKtVersion=$VERSION
          core:publishAllPublicationsToSonatypeRepository
          scene-graph:publishAllPublicationsToSonatypeRepository
          extensions:tools:publishAllPublicationsToSonatypeRepository
          extensions:gradle:texturepacker:publishAllPublicationsToSonatypeRepository
      - name: Release on Maven Central
        run: |
          TOKEN=$(printf "%s:%s" "$OSSRH_USERNAME" "$OSSRH_PASSWORD" | base64 -w0)
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.littlekt?publishing_type=automatic"
